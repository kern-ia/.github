name: Feature request
description: Propose a new capability or a change of behavior within an existing package.
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: >-
        Open this in the repository that owns the change. A feature lives in
        exactly one package's domain — if it fits none of them, it may be a new
        package, so open an RFC instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, or what is painful?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
